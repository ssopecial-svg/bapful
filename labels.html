<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밥풀 식재료 바코드 라벨</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  body { font-family: 'Pretendard', system-ui, sans-serif; margin: 0; padding: 24px; background: #F8F9FA; color: #111; }
  h1 { font-size: 22px; margin: 0 0 6px; } p { color: #6B6F75; margin: 0 0 18px; }
  .bar { display: flex; gap: 10px; margin-bottom: 18px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 20px; background: #96DC01; color: #fff; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .lb { background: #fff; border: 1px solid #E6E8EB; border-radius: 16px; padding: 14px; text-align: center; break-inside: avoid; }
  .lb img { width: 90px; height: 90px; object-fit: contain; }
  .lb b { display: block; font-size: 17px; margin: 2px 0 8px; }
  .lb svg { width: 100%; height: auto; }
  @media print { body { background: #fff; padding: 0; } .bar, h1, p { display: none; } .lb { border: 1px dashed #bbb; } @page { margin: 10mm; } }
</style>
</head>
<body>
<h1>밥풀 식재료 바코드 라벨</h1>
<p>실제 상품이 없거나 바코드가 안 읽힐 때 이 라벨을 인쇄해서 붙이세요. POS에 미리 등록돼 있어요.</p>
<div class="bar"><button onclick="print()">인쇄하기</button></div>
<div class="grid" id="g"></div>
<script src="/items.js"></script>
<script>
// EAN-13 바코드 SVG (외부 라이브러리 없이)
const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const P = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function ean13(code) {
  const d = code.split('').map(Number), par = P[d[0]];
  let bits = '101';
  for (let i = 1; i <= 6; i++) bits += (par[i - 1] === 'L' ? L : G)[d[i]];
  bits += '01010';
  for (let i = 7; i <= 12; i++) bits += R[d[i]];
  bits += '101';
  const m = 2, q = 11 * m, h = 70, W = bits.length * m + q * 2;
  let rects = '';
  for (let i = 0; i < bits.length; i++) if (bits[i] === '1') {
    const guard = i < 3 || (i >= 45 && i < 50) || i >= 92;
    rects += `<rect x="${q + i * m}" y="0" width="${m}" height="${guard ? h + 8 : h}"/>`;
  }
  const t = (x, s) => `<text x="${x}" y="${h + 20}" font-size="16" font-family="monospace" text-anchor="middle">${s}</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${h + 24}"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">${rects}</g>${t(q - 8, code[0])}${t(q + 24 * m, code.slice(1, 7))}${t(q + 70 * m, code.slice(7))}</svg>`;
}
document.getElementById('g').innerHTML = ITEMS.map(it => `<div class="lb"><img src="${it.img}" alt=""><b>${it.name}</b>${ean13(it.code)}</div>`).join('');
</script>
</body>
</html>
